
name: Build MoneyMate Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter ZIP
        run: |
          python3 - <<'PY'
          import zipfile
          import glob
          import os

          files = glob.glob("*.zip")
          if not files:
              raise Exception("No ZIP file found in repository!")

          zip_file = files[0]
          print("Extracting:", zip_file)

          with zipfile.ZipFile(zip_file, "r") as z:
              z.extractall("project")

          matches = []
          for root, dirs, filenames in os.walk("project"):
              if "pubspec.yaml" in filenames:
                  matches.append(root)

          if not matches:
              raise Exception("pubspec.yaml not found inside ZIP!")

          project_dir = matches[0]
          print("Flutter project found:", project_dir)

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("FLUTTER_PROJECT_DIR=" + os.path.abspath(project_dir) + "\n")
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter pub get

      - name: Build APK
        run: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMate-Android-APK
          path: ${{ env.FLUTTER_PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
