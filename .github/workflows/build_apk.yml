
      - name: Extract and inspect ZIP
        run: |
          python3 - <<'PY'
          import zipfile, glob, os

          zips = glob.glob("*.zip")
          if not zips:
              raise Exception("ZIP file missing!")

          with zipfile.ZipFile(zips[0]) as z:
              z.extractall("project")
              print("\n--- ZIP CONTENTS (first 100 files) ---")
              for name in z.namelist()[:100]:
                  print(name)

          print("\n--- SEARCHING FOR FLUTTER PROJECT ---")
          found = []
          for root, dirs, files in os.walk("project"):
              if "pubspec.yaml" in files:
                  found.append(root)

          if found:
              print("Flutter project found:", found[0])
          else:
              print("WARNING: pubspec.yaml NOT FOUND")
              print("This ZIP may not contain the Flutter source code.")
          PY
