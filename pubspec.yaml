name: moneymate
description: India-first personal money management app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  shared_preferences: ^2.2.1
  intl: ^0.18.1
  fl_chart: ^0.65.0
  provider: ^6.1.1
  go_router: ^12.1.1
  flutter_local_notifications: ^16.1.0
  permission_handler: ^11.1.0
  local_auth: ^2.1.7
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  lottie: ^2.7.0
  shimmer: ^3.0.0
  uuid: ^4.2.1
  csv: ^5.1.1
  file_picker: ^6.1.1
  share_plus: ^7.2.1
  url_launcher: ^6.2.1
  encrypt: ^5.0.3
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
